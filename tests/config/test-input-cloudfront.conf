input {
  generator {
    lines => [
      # CloudFront S3 Legacy W3C format (single-space delimited; grok accepts space or tab)

      # Valid 200 GET - should land in processed-logs
      '2026-06-25 00:09:13 FRA56-P2 17480 198.51.100.194 GET example1234567.cloudfront.net /data/store/img/lro-l-lroc-2-edr/LROLRC_0066A/DATA/ESM6/2026001/NAC/M1521892090RE.IMG 200 - Mozilla/5.0%20(compatible;%20DataForSeoBot/1.0;%20+https://dataforseo.com/dataforseo-bot) - - Miss rJ5WEI4j42dn98nkKZ7nA_XailDLI0Qwuhf96x54Uxws0C_i-PKUcg== pds.example.nasa.gov https 367 0.791 - TLSv1.3 TLS_AES_128_GCM_SHA256 Miss HTTP/1.1 - - 4028 0.784 Miss application/vnd.efi.img 264467400 - -',

      # Valid 404 GET - should land in processed-logs (failure outcome, no special tag)
      '2026-06-25 00:10:00 IAD89-C1 1234 203.0.113.42 GET example1234567.cloudfront.net /notfound.html 404 - Python-requests/2.28.0 - - Error abc123XYZ pds.example.nasa.gov https 215 0.123 - TLSv1.3 TLS_AES_128_GCM_SHA256 Error HTTP/1.1 - - 54321 0.120 Error text/html 1024 - -',

      # Valid 200 GET with dash user-agent - should land in empty-user-agents
      '2026-06-25 00:11:00 LAX3-C2 512 198.51.100.7 GET example1234567.cloudfront.net /index.html 200 - - - - Hit xyz789abc pds.example.nasa.gov https 100 0.001 - TLSv1.3 TLS_AES_128_GCM_SHA256 Hit HTTP/1.1 - - 12345 0.001 Hit text/html 2048 - -',

      # Archive download under /data/store/<node>/ with an upper-case node folder - organization.name becomes sbn
      '2026-06-25 00:12:00 IAD89-C1 2048 198.51.100.8 GET example1234567.cloudfront.net /data/store/SBN/gbo.ast.catalina.survey_V1_0/data/file.tab 200 - Mozilla/5.0 - - Hit sbnreq001 pds.example.nasa.gov https 300 0.050 - TLSv1.3 TLS_AES_128_GCM_SHA256 Hit HTTP/1.1 - - 12346 0.045 Hit text/plain 2048 - -',

      # /data/store/ folder that is not a node - organization.name stays en
      '2026-06-25 00:13:00 IAD89-C1 2048 198.51.100.9 GET example1234567.cloudfront.net /data/store/unknown-node/file.dat 200 - Mozilla/5.0 - - Hit unkreq002 pds.example.nasa.gov https 300 0.050 - TLSv1.3 TLS_AES_128_GCM_SHA256 Hit HTTP/1.1 - - 12347 0.045 Hit application/octet-stream 2048 - -',

      # Path that only starts with the node name, not /data/store/<node>/ - organization.name stays en
      '2026-06-25 00:14:00 IAD89-C1 2048 198.51.100.10 GET example1234567.cloudfront.net /data/storefront/img/file.dat 200 - Mozilla/5.0 - - Hit prefreq03 pds.example.nasa.gov https 300 0.050 - TLSv1.3 TLS_AES_128_GCM_SHA256 Hit HTTP/1.1 - - 12348 0.045 Hit application/octet-stream 2048 - -',

      # Bare /data/store/<node> without a trailing slash (directory request) - organization.name stays en
      '2026-06-25 00:15:00 IAD89-C1 2048 198.51.100.11 GET example1234567.cloudfront.net /data/store/img 200 - Mozilla/5.0 - - Hit dirreq004 pds.example.nasa.gov https 300 0.050 - TLSv1.3 TLS_AES_128_GCM_SHA256 Hit HTTP/1.1 - - 12349 0.045 Hit text/html 2048 - -'
    ]
    add_field => {
      "[@metadata][cf_format]" => "w3c"
      "[organization][name]"   => "en"
    }
    count => 1
  }
}
