input {
  # Rings
  s3 {
    bucket => "${S3_BUCKET_NAME}"
    region => "us-west-2"
    prefix => "rings/rings-apache-metrics/tools2"
    add_field => {
      "[organization][name]" => "rings"
      "[url][domain]" => "opus.pds-rings.seti.org"
      "[url][scheme]" => "https"
      "[event][dataset]" => "rings.http"
    }
    interval => 7200
    ecs_compatibility => "v8"
    sincedb_path => "/var/lib/logstash/plugins/inputs/s3/sincedb_file_input_rings1"
    id => "file_input_rings1"
    temporary_directory => "/var/lib/logstash/plugins/inputs/s3/tmp/file_input_rings1"
  }

  s3 {
    bucket => "${S3_BUCKET_NAME}"
    region => "us-west-2"
    prefix => "rings/rings-apache-metrics/server"
    add_field => {
      "[organization][name]" => "rings"
      "[url][domain]" => "pds-rings.seti.org"
      "[url][scheme]" => "https"
      "[event][dataset]" => "rings.http"
    }
    interval => 7200
    ecs_compatibility => "v8"
    sincedb_path => "/var/lib/logstash/plugins/inputs/s3/sincedb_file_input_rings2"
    id => "file_input_rings2"
    temporary_directory => "/var/lib/logstash/plugins/inputs/s3/tmp/file_input_rings2"
  }

  s3 {
    bucket => "${S3_BUCKET_NAME}"
    region => "us-west-2"
    prefix => "rings/rings-apache-metrics/tools_"
    add_field => {
      "[organization][name]" => "rings"
      "[url][domain]" => "pds-rings.seti.org"
      "[url][scheme]" => "https"
      "[event][dataset]" => "rings.http"
    }
    interval => 7200
    ecs_compatibility => "v8"
    sincedb_path => "/var/lib/logstash/plugins/inputs/s3/sincedb_file_input_rings3"
    id => "file_input_rings3"
    temporary_directory => "/var/lib/logstash/plugins/inputs/s3/tmp/file_input_rings3"
  }

}
