input {
  # PPI
  s3 {
    bucket => "${S3_BUCKET_NAME}"
    region => "us-west-2"
    prefix => "ppi/"
    add_field => {
      "[organization][name]" => "ppi"
      "[url][domain]" => "pds-ppi.igpp.ucla.edu"
      "[url][scheme]" => "https"
      "[event][dataset]" => "ppi.http"
    }
    interval => 7200
    ecs_compatibility => "v8"
    sincedb_path => "/var/lib/logstash/plugins/inputs/s3/sincedb_file_input_ppi1"
    id => "file_input_ppi1"
    temporary_directory => "/var/lib/logstash/plugins/inputs/s3/tmp/file_input_ppi1"
  }
}
