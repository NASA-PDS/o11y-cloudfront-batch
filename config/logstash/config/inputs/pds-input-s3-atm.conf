input {
  # ATM
  s3 {
    bucket => "${S3_BUCKET_NAME}"
    region => "us-west-2"
    prefix => "atm/atm-apache-http/"
    add_field => {
      "[organization][name]" => "atm"
      "[url][domain]" => "pds-atmospheres.nmsu.edu"
      "[url][scheme]" => "https"
      "[event][dataset]" => "atm.http"
    }
    interval => 7200
    ecs_compatibility => "v8"
    sincedb_path => "/var/lib/logstash/plugins/inputs/s3/sincedb_file_input_atm1"
    id => "file_input_atm1"
  }
  s3 {
    bucket => "${S3_BUCKET_NAME}"
    region => "us-west-2"
    prefix => "atm/atm-atmos-ftp/"
    add_field => {
      "[organization][name]" => "atm"
      "[url][domain]" => "pds-atmospheres.nmsu.edu"
      "[url][scheme]" => "ftp"
      "[event][dataset]" => "atm.ftp"
    }
    interval => 7200
    ecs_compatibility => "v8"
    sincedb_path => "/var/lib/logstash/plugins/inputs/s3/sincedb_file_input_atm2"
    id => "file_input_atm2"
  }
  s3 {
    bucket => "${S3_BUCKET_NAME}"
    region => "us-west-2"
    prefix => "atm/all/atm-atmos-apache"
    add_field => {
      "[organization][name]" => "atm"
      "[url][domain]" => "pds-atmospheres.nmsu.edu"
      "[url][scheme]" => "https"
      "[event][dataset]" => "atm.http"
    }
    interval => 7200
    ecs_compatibility => "v8"
    sincedb_path => "/var/lib/logstash/plugins/inputs/s3/sincedb_file_input_atm3"
    id => "file_input_atm3"
  }
  s3 {
    bucket => "${S3_BUCKET_NAME}"
    region => "us-west-2"
    prefix => "atm/all/atm-atmos-ftp"
    add_field => {
      "[organization][name]" => "atm"
      "[url][domain]" => "pds-atmospheres.nmsu.edu"
      "[url][scheme]" => "ftp"
      "[event][dataset]" => "atm.ftp"
    }
    interval => 7200
    ecs_compatibility => "v8"
    sincedb_path => "/var/lib/logstash/plugins/inputs/s3/sincedb_file_input_atm4"
    id => "file_input_atm4"
  }
}
