input {
  # NAIF
  s3 {
    bucket => "${S3_BUCKET_NAME}"
    region => "us-west-2"
    prefix => "naif/naif-httpdlogs"
    add_field => {
      "[organization][name]" => "naif"
      "[url][domain]" => "naif.jpl.nasa.gov"
      "[url][scheme]" => "https"
      "[event][dataset]" => "naif.http"
    }
    interval => 7200
    ecs_compatibility => "v8"
    sincedb_path => "/var/lib/logstash/plugins/inputs/s3/sincedb_file_input_naif1"
    id => "file_input_naif1"
    temporary_directory => "/var/lib/logstash/plugins/inputs/s3/tmp/file_input_naif1"
  }

  # NAIF
  s3 {
    bucket => "${S3_BUCKET_NAME}"
    region => "us-west-2"
    prefix => "naif/naif-xferlogs"
    add_field => {
      "[organization][name]" => "naif"
      "[url][domain]" => "pds-naif.jpl.nasa.gov"
      "[url][scheme]" => "ftp"
      "[event][dataset]" => "naif.ftp"
    }
    interval => 7200
    ecs_compatibility => "v8"
    sincedb_path => "/var/lib/logstash/plugins/inputs/s3/sincedb_file_input_naif2"
    id => "file_input_naif2"
    temporary_directory => "/var/lib/logstash/plugins/inputs/s3/tmp/file_input_naif2"
  }

  # NAIF - Data Upload Manager layout
  s3 {
    bucket => "${S3_BUCKET_NAME}"
    region => "us-west-2"
    prefix => "naif/weblogs/naif-apache/"
    add_field => {
      "[organization][name]" => "naif"
      "[url][domain]" => "naif.jpl.nasa.gov"
      "[url][scheme]" => "https"
      "[event][dataset]" => "naif.http"
    }
    interval => 7200
    ecs_compatibility => "v8"
    sincedb_path => "/var/lib/logstash/plugins/inputs/s3/sincedb_file_input_naif3"
    id => "file_input_naif3"
    temporary_directory => "/var/lib/logstash/plugins/inputs/s3/tmp/file_input_naif3"
  }
}
