input {
  # IMG
  s3 {
    bucket => "${S3_BUCKET_NAME}"
    region => "us-west-2"
    prefix => "img/"
    exclude_pattern => "/[.]|nohup[.]out|img-non-test-files|access_log[.][0-9]+[.]gz$"
    add_field => {
      "[organization][name]" => "img"
      "[url][domain]" => "pds-imaging.jpl.nasa.gov"
      "[url][scheme]" => "https"
      "[event][dataset]" => "img.http"
    }
    interval => 7200
    ecs_compatibility => "v8"
    sincedb_path => "/var/lib/logstash/plugins/inputs/s3/sincedb_file_input_img1"
    id => "file_input_img1"
  }
}
