input {
  # EN - Apache/IIS logs
  s3 {
    bucket => "${S3_BUCKET_NAME}"
    region => "us-west-2"
    prefix => "en/"
    add_field => {
      "[organization][name]" => "en"
      "[url][domain]" => "pds.nasa.gov"
      "[url][scheme]" => "https"
      "[event][dataset]" => "en.http"
    }
    interval => 900
    ecs_compatibility => "v8"
    sincedb_path => "/var/lib/logstash/plugins/inputs/s3/sincedb_file_input_en"
    id => "file_input_en"
  }

  # EN - CloudFront pds-main JSON logs (pds.mcp.nasa.gov)
  s3 {
    bucket => "${S3_CF_BUCKET_NAME}"
    region => "us-west-2"
    prefix => "pdc-cds-infra/cloudfront/access/json/pds-main/"
    add_field => {
      "[organization][name]" => "en"
      "[url][domain]" => "pds.mcp.nasa.gov"
      "[url][scheme]" => "https"
      "[event][dataset]" => "en.cloudfront.main"
      "[@metadata][cf_format]" => "json"
    }
    interval => 900
    ecs_compatibility => "v8"
    sincedb_path => "/var/lib/logstash/plugins/inputs/s3/sincedb_file_input_en_cf_main_json"
    id => "file_input_en_cf_main_json"
  }

  # EN - CloudFront pds-main W3C logs (pds.mcp.nasa.gov)
  s3 {
    bucket => "${S3_CF_BUCKET_NAME}"
    region => "us-west-2"
    prefix => "pdc-cds-infra/cloudfront/access/w3c/pds-main/"
    add_field => {
      "[organization][name]" => "en"
      "[url][domain]" => "pds.mcp.nasa.gov"
      "[url][scheme]" => "https"
      "[event][dataset]" => "en.cloudfront.main"
      "[@metadata][cf_format]" => "w3c"
    }
    interval => 900
    ecs_compatibility => "v8"
    sincedb_path => "/var/lib/logstash/plugins/inputs/s3/sincedb_file_input_en_cf_main_w3c"
    id => "file_input_en_cf_main_w3c"
  }

  # EN - CloudFront pds-legacy W3C logs (pds.nasa.gov)
  s3 {
    bucket => "${S3_CF_BUCKET_NAME}"
    region => "us-west-2"
    prefix => "pdc-cds-infra/cloudfront/access/w3c/portal-legacy/"
    add_field => {
      "[organization][name]" => "en"
      "[url][domain]" => "pds.nasa.gov"
      "[url][scheme]" => "https"
      "[event][dataset]" => "en.cloudfront.legacy"
      "[@metadata][cf_format]" => "w3c"
    }
    interval => 900
    ecs_compatibility => "v8"
    sincedb_path => "/var/lib/logstash/plugins/inputs/s3/sincedb_file_input_en_cf_legacy_w3c"
    id => "file_input_en_cf_legacy_w3c"
  }
}
