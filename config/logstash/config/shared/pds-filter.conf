filter {

  # Currently, @timestamp is set to the current time.  We store that in the
  # index_time field so that we can tell when records are ingested.  Later,
  # @timestamp will be overwritten with the timestamp of the logged request.
  mutate {
    add_field => { "[event][ingested]" => "%{@timestamp}" }
  }

  # Add source file as useful metadata for logging purposes
  if [@metadata][s3][key] {
    mutate {
      add_field => {
        "[object][key]" => "%{[@metadata][s3][key]}"
        "[file][name]" => "%{[@metadata][s3][key]}"
      }
    }

    # Inputs that read from a bucket other than S3_BUCKET_NAME set [@metadata][s3_bucket]
    if [@metadata][s3_bucket] {
      mutate {
        add_field => { "[file][path]" => "s3://%{[@metadata][s3_bucket]}/%{[@metadata][s3][key]}" }
      }
    } else {
      mutate {
        add_field => { "[file][path]" => "s3://${S3_BUCKET_NAME}/%{[@metadata][s3][key]}" }
      }
    }
  }

  # Handle bad unicode characters
  mutate {
    replace => { "message" => "%{message}" }
    id => "fix_bad_unicode"
  }

  # Common fields for all logs
  mutate {
    add_field => {
      "[@metadata][timestamp]" => "%{+YYYY-MM-dd'T'HH:mm:ss.SSSZ}"
      "[event][kind]" => "event"
      "[event][category]" => ["web", "network"]
      "[event][type]" => ["access", "info"]
      "[event][dataset]" => "web.analytics"
      "[event][module]" => "web"
      "[event][provider]" => "pds"
      "[event][action]" => "access"
      "[event][sequence]" => "0"
    }
  }

  # Extract source address from message first
  if "%{[source][address]}" in [source][address] {
    grok {
      match => {
        "message" => [
          "%{IPORHOST:[source][address]}",
          "%{HOSTNAME:[source][address]}"
        ]
      }
      tag_on_failure => ["_source_address_parse_failure"]
    }
  }

  # Drop CloudFront W3C comment/header lines before grok attempts to parse them
  if [message] =~ /^#/ {
    drop { }
  }

  # CloudFront JSON Standard Logging v2 — one JSON object per line (NDJSON).
  # Decode the raw JSON string from [message] into event fields before renaming.
  # Parenthesis-named fields (e.g. cs(User-Agent)) require Ruby because Logstash
  # field-ref syntax cannot address names containing parentheses.
  if [@metadata][cf_format] == "json" {

    # Decode the raw NDJSON line into top-level event fields.
    # [message] is preserved so the fingerprint filter below can still use it.
    json {
      source => "message"
      tag_on_failure => ["_cf_json_parse_failure"]
      id => "cf_json_decode"
    }

    # Step 1: Rename fields whose names contain parentheses
    ruby {
      code => '
        {
          "cs(User-Agent)" => "[user_agent][original]",
          "cs(Referer)"    => "[http][request][referrer]",
          "cs(Host)"       => "[temp][cf_cs_host]",
          "cs(Cookie)"     => "[temp][cf_cs_cookie]",
          "timestamp(ms)"  => "[temp][cf_timestamp_ms]"
        }.each do |src, dst|
          v = event.get(src)
          unless v.nil?
            event.set(dst, v)
            event.remove(src)
          end
        end
      '
      id => "cf_json_rename_special_fields"
    }

    # Step 2: Map remaining CloudFront fields to ECS
    # x-host-header overwrites the static [url][domain] default set by the
    # input's add_field — a single distribution/prefix can carry prod, SIT,
    # and dev traffic mixed together, so the per-record Host header is the
    # only way to tell them apart downstream.
    mutate {
      rename => {
        "c-ip"            => "[source][address]"
        "cs-method"       => "[http][request][method]"
        "cs-uri-stem"     => "[url][path]"
        "sc-status"       => "[http][response][status_code]"
        "sc-bytes"        => "[http][response][body][bytes]"
        "cs-bytes"        => "[http][request][body][bytes]"
        "c-country"       => "[source][geo][country_iso_code]"
        "x-edge-location" => "[temp][cf_edge_location]"
        "x-host-header"   => "[url][domain]"
      }
      convert => {
        "[http][response][status_code]" => "integer"
        "[http][response][body][bytes]" => "integer"
        "[http][request][body][bytes]"  => "integer"
      }
      id => "cf_json_ecs_rename"
    }

    # Step 3: Set [event][start] from CloudFront date + time (both UTC).
    # The shared date filter later in this pipeline parses it into @timestamp.
    mutate {
      add_field => { "[event][start]" => "%{date} %{time}" }
      id => "cf_json_event_start"
    }

    # Step 4: Promote query string when present (CloudFront uses "-" for no query)
    if [cs-uri-query] and [cs-uri-query] != "-" {
      mutate {
        rename => { "cs-uri-query" => "[url][query]" }
        id => "cf_json_query_promote"
      }
    }

    # Step 5: Normalize referrer (CloudFront uses "-" for absent)
    if [http][request][referrer] == "-" {
      mutate { remove_field => ["[http][request][referrer]"] }
    }

    # Step 6: URL-decode user agent (CloudFront percent-encodes spaces and special chars).
    # Leave "-" as-is — the shared user-agent filter below tags it as _empty_user_agent.
    if [user_agent][original] and [user_agent][original] != "-" {
      urldecode { field => "[user_agent][original]" }
    }

    # Step 7: Remove CloudFront-specific fields not needed downstream
    mutate {
      remove_field => [
        "timestamp", "[temp][cf_timestamp_ms]", "date", "time",
        "time-taken", "time-to-first-byte",
        "cs-uri-query",
        "x-edge-result-type", "x-edge-response-result-type", "x-edge-detailed-result-type",
        "x-edge-request-id", "x-forwarded-for",
        "fle-status", "fle-encrypted-fields",
        "connection-id", "distribution-tenant-id", "distributionid", "DistributionId",
        "cache-behavior-path-pattern", "c-port", "asn",
        "ssl-protocol", "ssl-cipher", "cs-protocol-version", "cs-protocol",
        "sc-content-type", "sc-content-len", "sc-range-start", "sc-range-end",
        "origin-fbl", "origin-lbl",
        "[temp][cf_cs_host]", "[temp][cf_cs_cookie]"
      ]
      id => "cf_json_cleanup"
    }

  } else {

  # Extract the message from the log (grok for Apache, IIS, W3C CloudFront, FTP formats)
  grok {
    ecs_compatibility => "v8"
    match => { "message" => [
        # CloudFront S3 Legacy (W3C) - tab or space delimited
        # Fields: date time x-edge-location sc-bytes c-ip cs-method cs(Host) cs-uri-stem sc-status cs(Referer) cs(User-Agent) cs-uri-query cs(Cookie) x-edge-result-type x-edge-request-id x-host-header cs-protocol cs-bytes time-taken x-forwarded-for ssl-protocol ssl-cipher x-edge-response-result-type cs-protocol-version fle-status fle-encrypted-fields c-port time-to-first-byte x-edge-detailed-result-type sc-content-type sc-content-len sc-range-start sc-range-end
        "(?<[event][start]>%{YEAR}-%{MONTHNUM2}-%{MONTHDAY}[ \t]%{TIME})[ \t]%{NOTSPACE:[temp][cf_edge_location]}[ \t]%{NUMBER:[http][response][body][bytes]}[ \t]%{IPORHOST:[source][address]}[ \t]%{WORD:[http][request][method]}[ \t]%{HOSTNAME:[temp][cf_host]}[ \t]%{NOTSPACE:[url][path]}[ \t]%{NUMBER:[http][response][status_code]}[ \t]%{NOTSPACE:[http][request][referrer]}[ \t]%{NOTSPACE:[user_agent][original]}[ \t]%{NOTSPACE:[temp][cf_query]}[ \t]%{NOTSPACE:[temp][cf_cookie]}[ \t]%{NOTSPACE:[temp][cf_result_type]}[ \t]%{NOTSPACE:[temp][cf_request_id]}[ \t]%{NOTSPACE:[url][domain]}[ \t]%{NOTSPACE:[url][scheme]}[ \t]%{NUMBER:[http][request][body][bytes]}[ \t]%{NUMBER:[event][duration]}",

        # Apache Combined Log Format
        "%{COMBINEDAPACHELOG}",

        # Apache Common Log Format
        "%{COMMONAPACHELOG}",

        # Minimal Apache common log format missing the status code, response size, referrer, and user agent
        "%{IP:[source][address]} - - \[%{HTTPDATE:[event][start]}\] \"%{WORD:[http][request][method]} %{URIPATH:[url][path]} HTTP/%{NUMBER:[http][version]}\"",

        # W3C Extended Log File Format with a cs(Referer) column after the user agent. The user agent may
        # contain spaces, so the referer ("-" or a URL) is captured explicitly. It is listed before the
        # patterns below, which would otherwise shift columns or fold the referer into the user agent.
        "%{TIMESTAMP_ISO8601:[event][start]} (?:%{WORD:[server][site]}|-) %{IP:[server][ip]} %{WORD:[http][request][method]} %{NOTSPACE:[url][path]} %{NOTSPACE:[url][query]} (?:%{NUMBER:[server][port]}|-) %{NOTSPACE:[user][name]} (?:%{IP:[source][address]}|-) %{DATA:[user_agent][original]} (?:-|%{URI:[http][request][referrer]}) (?:%{NUMBER:[http][response][status_code]}|-) (?:%{NUMBER:[http][response][substatus]}|-) (?:%{NUMBER:[http][response][win32_status]}|-) (?:%{NUMBER:[http][response][body][bytes]}|-) (?:%{NUMBER:[event][duration]}|-)",

        # IIS HTTP Log Format (with W3SVC)
        "%{TIMESTAMP_ISO8601:[event][start]} %{NOTSPACE:[server][site]} %{IP:[server][ip]} %{WORD:[http][request][method]} %{DATA:[url][path]}(?:%{URIPARAM:[url][query]})? %{NOTSPACE:[server][port]} %{NOTSPACE:[user][name]} %{IP:[source][address]} %{DATA:[user_agent][original]} %{NUMBER:[http][response][status_code]} %{NUMBER:[http][response][substatus]} %{NUMBER:[http][response][win32_status]} %{NUMBER:[http][response][body][bytes]} %{NUMBER:[http][request][body][bytes]} %{NUMBER:[event][duration]}",

        # IIS HTTP Log Format (without W3SVC)
        "%{TIMESTAMP_ISO8601:[event][start]} %{IP:[server][ip]} %{WORD:[http][request][method]} %{DATA:[url][path]} %{NOTSPACE:[url][query]} %{NOTSPACE:[server][port]} %{NOTSPACE:[user][name]} %{IP:[source][address]} %{DATA:[user_agent][original]} %{NUMBER:[http][response][status_code]} %{NUMBER:[http][response][substatus]} %{NUMBER:[http][response][win32_status]} %{NUMBER:[http][response][body][bytes]} %{NUMBER:[http][request][body][bytes]} %{NUMBER:[event][duration]}",

        # W3C Extended Log File Format
        # Note: %{NOTSPACE} used for url.path (not %{URIPATH}) to handle non-ASCII characters
        # in URLs (e.g. Chinese characters appended by some browsers/proxies)
        # time-taken is "-" when the server did not record it; event.duration is then not set
        "%{TIMESTAMP_ISO8601:[event][start]} (?:%{WORD:[server][site]}|-) %{IP:[server][ip]} %{WORD:[http][request][method]} %{NOTSPACE:[url][path]} %{NOTSPACE:[url][query]} (?:%{NUMBER:[server][port]}|-) %{NOTSPACE:[user][name]} (?:%{IP:[source][address]}|-) %{DATA:[user_agent][original]} (?:%{NUMBER:[http][response][status_code]}|-) (?:%{NUMBER:[http][response][substatus]}|-) (?:%{NUMBER:[http][response][win32_status]}|-) (?:%{NUMBER:[http][response][body][bytes]}|-) (?:%{NUMBER:[event][duration]}|-)",

        # W3C/IIS URI path is missing (represented by a dash)
        "%{TIMESTAMP_ISO8601:[event][start]} (?:%{WORD:[server][site]}|-) %{IP:[server][ip]} %{WORD:[http][request][method]} %{NOTSPACE:[url][path]} (?:%{NUMBER:[server][port]}|-) %{NOTSPACE:[user][name]} (?:%{IP:[source][address]}|-) %{DATA:[user_agent][original]} (?:%{NUMBER:[http][response][status_code]}|-) (?:%{NUMBER:[http][response][substatus]}|-) (?:%{NUMBER:[http][response][win32_status]}|-) (?:%{NUMBER:[http][response][body][bytes]}|-) (?:%{NUMBER:[event][duration]}|-)",

        # IIS HTTP Log Format (minimal fields)
        "%{TIMESTAMP_ISO8601:[event][start]} %{IP:[server][ip]} %{WORD:[http][request][method]} %{DATA:[url][path]} %{NOTSPACE:[url][query]} %{NOTSPACE:[server][port]} %{NOTSPACE:[user][name]} %{IP:[source][address]} %{DATA:[user_agent][original]} %{NUMBER:[http][response][status_code]} %{NUMBER:[http][response][substatus]} %{NUMBER:[http][response][win32_status]}",

        # IIS FTP Log Format
        "%{TIMESTAMP_ISO8601:[event][start]} (?:%{IP:[source][address]}|-) %{NOTSPACE:[user][name]} %{NOTSPACE:[server][site]} %{IP:[server][ip]} (?:%{NUMBER:[server][port]}|-) %{WORD:[ftp][command]} %{DATA:[url][path]} (?:%{NUMBER:[http][response][status_code]:int}|-) (?:%{NUMBER:[http][response][win32_status]}|-) (?:%{NUMBER:[http][response][body][bytes]}|-) (?:%{NUMBER:[http][request][body][bytes]}|-) (?:%{NUMBER:[event][duration]}|-)",

        # ATM/NAIF FTP (xferlog) Log Format. The username field is a number or, for most real traffic,
        # text such as "anonymous@" or an e-mail address.
        "%{DAY:[temp][day_name]} %{MONTH:[temp][month_name]}\s+%{MONTHDAY:[temp][day]} %{TIME:[temp][time]} %{YEAR:[temp][year]} %{NUMBER:[event][ftp_transfer_status]:int} %{IP:[source][address]} %{NUMBER:[network][bytes]:int} %{DATA:[url][path]} %{WORD:[event][ftp_flag_1]} %{WORD:[event][ftp_flag_2]} %{WORD:[event][ftp_flag_3]} %{WORD:[event][ftp_flag_4]} (?:%{NUMBER:[user][id]:int}|%{NOTSPACE:[user][name]}) %{WORD:[network][protocol]} %{NUMBER:[http][response][status_code]:int} %{DATA:[server][domain]} %{WORD:[event][action]}",

        # Handle ATM logs where the IP is already translated to a host
        "%{HOSTNAME:[source][address]} - - \[%{HTTPDATE:[event][start]}\] \"%{WORD:[http][request][method]} %{DATA:[url][original]} HTTP/%{NUMBER:[http][version]}\" %{NUMBER:[http][response][status_code]} %{NUMBER:[http][response][body][bytes]}",

        # Handle PPI and ATM logs where username info is wonky
        "%{IP:[source][address]} %{NOTSPACE:[user][ident]} %{NOTSPACE:[user][name]} \[%{HTTPDATE:[event][start]}\] \"%{WORD:[http][request][method]} %{URIPATH:[url][original]}(?: HTTP\/%{NUMBER:[http][version]})?\" %{NUMBER:[http][response][status_code]} %{NUMBER:[http][response][body][bytes]} \"%{DATA:[http][request][referrer]}\" \"%{DATA:[user_agent][original]}\"",

        # Apache-style log with IP first
        "%{IP:[source][address]} - - \[%{HTTPDATE:[event][start]}\] \"%{WORD:[http][request][method]} %{DATA:[url][path]} HTTP/%{NUMBER:[http][version]}\" %{NUMBER:[http][response][status_code]} %{NUMBER:[http][response][body][bytes]} \"%{DATA:[http][request][referrer]}\" \"%{DATA:[user_agent][original]}\"",

        # Apache-style log invalid username
        "%{IP:[source][address]} - %{DATA:[user][name]} \[%{HTTPDATE:[event][start]}\] \"%{WORD:[http][request][method]} %{URIPATHPARAM:[http][request][body][content]} HTTP/%{NUMBER:[http][version]}\" %{INT:[http][response][status_code]} %{INT:[http][response][body][bytes]} \"%{DATA:[http][request][referrer]}\" \"%{DATA:[user_agent][original]}\""
      ]
    }
    id => "grok_filter_initial_parse"
    tag_on_failure => "_grok_filter_initial_parse_failure"
  }

  # CloudFront post-processing: clean up temp fields
  if [temp][cf_edge_location] {
    # Normalize query string: CloudFront uses "-" for empty
    if [temp][cf_query] and [temp][cf_query] != "-" {
      mutate {
        add_field => { "[url][query]" => "%{[temp][cf_query]}" }
      }
    }
    # Normalize referrer: CloudFront uses "-" for empty
    if [http][request][referrer] == "-" {
      mutate { remove_field => ["[http][request][referrer]"] }
    }
    mutate {
      remove_field => [
        "[temp][cf_edge_location]", "[temp][cf_host]",
        "[temp][cf_query]", "[temp][cf_cookie]",
        "[temp][cf_result_type]", "[temp][cf_request_id]"
      ]
    }
  }
  } # end else (non-JSON formats: Apache, IIS, W3C CloudFront, FTP)

  # Drop logs with invalid URL encoding
  if [url][original] =~ /\\u00[0-9a-fA-F]{2}/ {
    drop { }
  }

  # Remove other non-printable ASCII characters from [url][original]
  mutate {
    gsub => [
      "[url][original]", "[^\x20-\x7E]", ""
    ]
  }

  if [temp][day_name] and [temp][month_name] and [temp][day] and [temp][time] and [temp][year] {
    # Combine parts of the timestamp into a single field
    mutate {
      add_field => {
        "[temp][datetime]" => "%{[temp][month_name]} %{[temp][day]} %{[temp][year]} %{[temp][time]}"
      }
    }

    # Parse the combined timestamp into [event][start]
    date {
      match => ["[temp][datetime]", "MMM dd yyyy HH:mm:ss"]
      target => "@timestamp"
      remove_field => ["temp"]
    }
  } else {
    # Copy timestamp to [event][start] for Apache logs
    if [timestamp] and !([event][start]) {
      mutate {
        copy => { "timestamp" => "[event][start]" }
      }
    }

    # Normalize tab-separated datetime before parsing — CloudFront W3C grok captures
    # date<TAB>time inside [event][start] but the date filter expects a space.
    if [event][start] {
      mutate {
        gsub => [ "[event][start]", "\t", " " ]
      }
    }

    # Parse all timestamps to @timestamp
    if [event][start] {
      date {
        match => [ "[event][start]", "ISO8601", "yyyy-MM-dd HH:mm:ss", "EEE MMM dd HH:mm:ss yyyy", "dd/MMM/yyyy:HH:mm:ss Z", "dd/MMM/yyyy:HH:mm:ss" ]
        target => "@timestamp"
        timezone => "UTC"
        tag_on_failure => "_datetimeparsefailure"
      }
    } else if [event][action] {
      date {
        match => [ "message", "EEE MMM dd HH:mm:ss yyyy" ]
        target => "@timestamp"
        timezone => "UTC"
        tag_on_failure => "_datetimeparsefailure"
      }
    }
  }

  # Copy @timestamp to [event][start]
  mutate {
    copy => { "@timestamp" => "[event][start]" }
  }

  # Handle datetime parsing failures
  if "_datetimeparsefailure" in [tags] {
    mutate {
      add_field => {
        "[error][message]" => "Failed to parse datetime from %{[event][start]}"
        "[error][type]" => "datetime_parse_error"
        "[error][details][timestamp]" => "%{[event][start]}"
        "[error][details][message]" => "%{message}"
        "[error][details][pattern]" => "dd/MMM/yyyy:HH:mm:ss Z"
      }
    }
  }

  # Drop Apache internal dummy connections and loopback requests — not real traffic
  if [source][address] in ["::1", "127.0.0.1"] or [user_agent][original] =~ /internal dummy connection/ {
    drop { }
  }

  # Handle missing source address
  if ![source][address] {
    mutate {
      add_field => {
        "[error][message]" => "Missing source address in log message"
        "[error][type]" => "missing_source_address"
      }
      add_tag => [ "_missing_source_address" ]
    }
  }

  # Handle IIS-specific fields
  if [http][response][substatus] {
    mutate {
      add_field => {
        "[http][response][status_code]" => "%{[http][response][status_code]}.%{[http][response][substatus]}"
      }
      remove_field => ["[http][response][substatus]"]
    }
  }

  if [http][response][win32_status] {
    mutate {
      add_field => {
        "[error][code]" => "%{[http][response][win32_status]}"
      }
      remove_field => ["[http][response][win32_status]"]
    }
  }

  # HTTP Method Validation - Use ruby for string manipulation
  if [http][request][method] {
    ruby {
      code => '
        method = event.get("[http][request][method]")
        if method && method != ""
          event.set("[http][request][method]", method.upcase)
        end
      '
    }
  }

  if [http][request][method] and [http][request][method] != "" {
    if [http][request][method] =~ "^(ABOR|ACCT|ALLO|APPE|AUTH|CDUP|CWD|DELE|FEAT|HELP|LIST|MODE|MKD|NLST|NOOP|OPTS|PASS|PASV|PBSZ|PORT|PROT|PWD|QUIT|REIN|REST|RETR|RMD|RNFR|RNTO|SITE|SIZE|STAT|STOR|STOU|STRU|SYST|TYPE|USER|DATACHANNELOPENED|DATACHANNELCLOSED|CONTROLCHANNELOPENED|CONTROLCHANNELCLOSED)$" {
      mutate {
        copy => { "[http][request][method]" => "[ftp][command]" }
        remove_field => ["[http][request][method]"]
      }
    } else if [http][request][method] =~ "^(SSTP_DUPLEX_POST|SSTP_DUPLEX_GET)$" {
      mutate {
        add_tag => ["_invalid_http_method"]
        add_field => {
          "[error][type]" => "invalid_http_method_known"
          "[error][message]" => "Invalid HTTP method (known issue: RMS): %{[http][request][method]}"
        }
      }
    } else if [http][request][method] !~ "^(GET|POST|PUT|DELETE|HEAD|OPTIONS|PATCH)$" {
      mutate {
        add_tag => ["_invalid_http_method"]
        add_field => {
          "[error][type]" => "invalid_http_method"
          "[error][message]" => "Invalid HTTP method: %{[http][request][method]}"
        }
      }
    }
  }

  # Drop scanner/attack traffic with non-standard HTTP methods.
  # These are server-rejected probes with no analytics value:
  #   PRI        — HTTP/2 connection preface sent to HTTP/1.1 servers (scanner probe)
  #   TRACE/TRACK — Diagnostic methods disabled for security; used by Nessus and similar scanners
  #   DEBUG      — Non-standard method used by vulnerability scanners (e.g. Nessus)
  #   NESSUS     — Nessus vulnerability scanner method
  #   SEARCH/PROPFIND — WebDAV methods used by scanners probing for WebDAV support
  #   GNUTELLA CONNECT — Gnutella P2P protocol probe
  #   T3/T3S     — Oracle WebLogic T3 protocol probe
  #   Random strings (e.g. AAAA, QOBCWU) — HTTP method fuzzing by automated scanners
  # All of these result in 4xx/5xx responses and are not legitimate user traffic.
  if "_invalid_http_method" in [tags] {
    drop { }
  }

  # Handle FTP-specific fields
  if [ftp][command] {
    if [ftp][command] in ["RETR", "BOTZETR"] {
      mutate {
        add_field => {
          "[event][action]" => "%{[ftp][command]}"
          "[event][category]" => ["file", "network"]
          "[event][type]" => ["access", "info"]
        }
        remove_field => ["[ftp][command]"]
      }

      # Set outcome based on status code
      if [http][response][status_code] and [http][response][status_code] < 400 {
        mutate {
          add_field => { "[event][outcome]" => "success" }
        }
      } else {
        mutate {
          add_field => { "[event][outcome]" => "failure" }
        }
      }
    } else {
      drop {}
    }
  }

  # Handle status code arrays - ensure single integer value
  if [http][response][status_code] {
    ruby {
      code => '
        status_code = event.get("[http][response][status_code]")
        if status_code.is_a?(Array)
          # Take the first element and convert to integer
          first_status = status_code.first
          if first_status.is_a?(String)
            event.set("[http][response][status_code]", first_status.to_i)
          else
            event.set("[http][response][status_code]", first_status.to_i)
          end
        elsif status_code.is_a?(String)
          # Convert string to integer
          event.set("[http][response][status_code]", status_code.to_i)
        end
      '
    }
  }

  # Map HTTP status codes to ECS outcome
  if [http][response][status_code] and ![event][outcome] {
    if [http][response][status_code] < 400 {
      mutate {
        add_field => { "[event][outcome]" => "success" }
      }
    } else {
      mutate {
        add_field => { "[event][outcome]" => "failure" }
      }
    }
  }

  # Array to String Conversion - Handle arrays by taking first element
  if [source][address] {
    ruby {
      code => '
        if event.get("[source][address]").is_a?(Array)
          event.set("[source][address]", event.get("[source][address]").first)
        end
      '
    }
  }

  if [url][path] {
    ruby {
      code => '
        if event.get("[url][path]").is_a?(Array)
          event.set("[url][path]", event.get("[url][path]").first)
        end
      '
    }
  }

  if [url][domain] {
    ruby {
      code => '
        if event.get("[url][domain]").is_a?(Array)
          event.set("[url][domain]", event.get("[url][domain]").first)
        end
      '
    }
  }

  # Enhanced Event Outcome and Error Handling
  if [http][response][status_code] and [http][response][status_code] != "" {
    mutate {
      convert => { "[http][response][status_code]" => "integer" }
      tag_on_failure => ["_invalid_status_code"]
    }
    if "_invalid_status_code" not in [tags] {
      if [http][response][status_code] < 400 {
        mutate {
          add_field => {
            "[event][outcome]" => "success"
          }
          id => "set_success_outcome"
        }
      } else {
        mutate {
          add_field => {
            "[event][outcome]" => "failure"
            "[error][type]" => "http_error"
            "[error][message]" => "HTTP %{[http][response][status_code]}"
          }
          id => "set_failure_outcome"
        }
      }
    } else {
      mutate {
        remove_tag => ["_invalid_status_code"]
        add_field => {
          "[event][outcome]" => "unknown"
          "[error][message]" => "Invalid HTTP status code: %{[http][response][status_code]}"
          "[error][type]" => "invalid_status_code"
        }
      }
    }
  }

  # Tag Processing - Deduplicate tags
  if [tags] {
    ruby {
      code => '
        if event.get("tags").is_a?(Array)
          # Remove duplicates while preserving order
          unique_tags = event.get("tags").uniq
          event.set("tags", unique_tags)
        end
      '
    }
  }

  # URL Component Validation
  if [url][path] == "-" or [url][path] == "%{[url][original]}" {
    mutate {
      remove_field => ["[url][path]"]
      add_tag => ["_missing_url_path"]
    }
  }

  # Enhanced User Agent Parsing
  if [user_agent][original] {
    if [user_agent][original] == "-" {
      mutate {
        replace => { "[user_agent][original]" => "Unknown" }
        add_tag => ["_empty_user_agent"]
      }
    }
    useragent {
      source => "[user_agent][original]"
      target => "[user_agent]"
      add_field => {
        "[user_agent][device][type]" => "%{[user_agent][device][name]}"
      }
    }
  }

  # Domain Deduplication - Use native filters where possible
  if [url][domain] and [source][address] {
    # If domain equals source address, remove it
    if [url][domain] == [source][address] {
      mutate {
        remove_field => ["[url][domain]"]
      }
    }
    # For array handling, we still need Ruby for complex filtering
    else {
      ruby {
        code => '
          domain = event.get("[url][domain]")
          source_addr = event.get("[source][address]")

          if domain.is_a?(Array)
            # Remove source address from domain array and take first remaining
            filtered_domains = domain.select { |d| d != source_addr }
            event.set("[url][domain]", filtered_domains.first || domain.first)
          end
        '
      }
    }
  }

  # Clean up fields
  mutate {
    remove_field => [ "timestamp", "date", "time" ]
    id => "cleanup_fields"
  }

  # Extract URL components
  if [url][original] {

    urldecode {
      field => "[url][original]"
      id => "decode_url"
    }

    grok {
      ecs_compatibility => "v8"
      match => {
        "[url][original]" => [
          "%{URIPROTO:[url][scheme]}://(?:%{USER:[url][username]}:(?<[url][password]>[^@]*)@)?(?:%{IPORHOST:[url][address]}(?::%{POSINT:[url][port]}))?(?:%{URIPATH:[url][path]}(?:%{URIPARAM:[url][query]}))?",
          "%{IPORHOST:[url][address]}(?::%{POSINT:[url][port]})(?:%{URIPATH:[url][path]}(?:%{URIPARAM:[url][query]}))?",
          "%{URIPATH:[url][path]}(?:%{URIPARAM:[url][query]})"
        ]
      }
      tag_on_failure => "_url_query_parse_skip"
    }

    if "_url_query_parse_skip" not in [tags] {
      # parse the address to distinguish domain or ip
      grok {
        match => {
          "[url][address]" => "(%{IP:[source][address]}|%{HOSTNAME:[url][domain]})"
        }
        tag_on_failure => "_grokparsefailure_ipvsdomain"
      }
      # Requires a custom plugin here, see https://www.elastic.co/guide/en/logstash/current/plugins-filters-tld.html
      tld {
        source => "[url][domain]"
        target => "[url][tld]"
      }
      mutate {
        rename => {
          "[url][tld][domain]" => "[url][registered_domain]"
          "[url][tld][tld]" => "[url][top_level_domain]"
          "[url][tld][sld]" => "[url][second_level_domain]"
          "[url][tld][trd]" => "[url][sub_domain]"
        }
        remove_field => [ "[url][tld]" ]
      }
      # parse the query to extract fragment
      grok {
        match => {
          "[url][query]" => "^\?(?<[url][query]>[A-Za-z0-9$.+!*'|(){},~@%&/=:;_?\-\[\]<>]*)(?:#(?:%{WORD:[url][fragment]}))?"
        }
        overwrite => [ "[url][query]" ]
        tag_on_failure => "_grokparsefailure_urlquery"
      }

      # Identify logs with suspicious query parameters
      if [url][query] =~ /allow_url_include|auto_prepend_file/ {
        mutate { add_tag => ["_suspicious_query"] }
      }

      if [url][query] {
        kv {
          source => "[url][query]"
          field_split => "&"
          value_split => "="
          target => "[url][query_params]"
        }
        urldecode {
          field => "[url][query]"
        }
        urldecode {
          field => "[url][query_params]"
        }
        # Sanitize query param keys: dots/brackets in keys (e.g. nls[file][foo.nasl][1])
        # are interpreted by OpenSearch as nested field paths, causing mapper cast errors.
        # Replace . and [] characters with _ so keys are safe flat keyword field names.
        ruby {
          code => '
            params = event.get("[url][query_params]")
            if params.is_a?(Hash)
              sanitized = {}
              params.each do |k, v|
                safe_key = k.gsub(/[\.\[\]]/, "_").gsub(/_+/, "_").gsub(/^_|_$/, "")
                # OpenSearch rejects empty field names (e.g. the jQuery cache-buster "_=123")
                safe_key = "_" if safe_key.empty?
                sanitized[safe_key] = v
              end
              event.set("[url][query_params]", sanitized)
            end
          '
          id => "sanitize_query_param_keys"
        }
        # Build url.query_parts: array of decoded "key=value" strings for wildcard filtering
        ruby {
          code => '
            params = event.get("[url][query_params]")
            if params.is_a?(Hash)
              parts = params.map { |k, v| "#{k}=#{v}" }
              event.set("[url][query_parts]", parts) unless parts.empty?
            end
          '
          id => "build_query_parts"
        }
      }
    } else {
      mutate {
        add_field => { "[url][path]" => "%{[url][original]}" }
      }
    }
  }

  # Build url.path_parts and url.path_depth for path-level egress analysis.
  # path_parts: array of individual segments for wildcard filtering (e.g. mission name anywhere in path)
  # path_depth: array of cumulative prefixes at every level for hierarchical aggregation in dashboards
  #   e.g. /data/mgs/vol1 → ["/data", "/data/mgs", "/data/mgs/vol1"]
  if [url][path] {
    ruby {
      code => '
        path = event.get("[url][path]")
        if path.is_a?(String)
          parts = path.split("/").reject { |s| s.empty? }
          unless parts.empty?
            event.set("[url][path_parts]", parts)
            depths = parts.each_with_index.map { |_, i| "/" + parts[0..i].join("/") }
            event.set("[url][path_depth]", depths)
          end
        end
      '
      id => "build_path_parts"
    }
  }

  # Use uap_core regex patterns to detect bots/spiders
  useragent {
    ecs_compatibility => "v8"
    source => "[user_agent][original]"
    target => "[user_agent]"
    regexes => "${LS_SETTINGS_DIR}/plugins/regexes.yaml"
    id => "useragent_filter_parse_apache_combined"
  }

  # Determine the geographic location from which the request came.
  # Skip only for records that failed parsing — informational tags like
  # _url_query_parse_skip or _empty_user_agent don't indicate bad records.
  if "bad_log" not in [tags] and "_grokparsefailure" not in [tags] and "_missing_source_address" not in [tags] and [source][address] {
    geoip {
      ecs_compatibility => "v8"
      source => "[source][address]"
      target => "[source]"
    }

    # Reverse lookup any raw IP addresses to get the domain from which the
    # request originated.
    mutate {
      add_field => { "[source][domain]" => "%{[source][address]}" }
    }

    if [source][address] =~ /^\d{1,3}(\.\d{1,3}){3}$/ {
      dns {
        action => "replace"
        reverse => [ "[source][domain]" ]
        nameserver => [ "10.1.0.2", "8.8.8.8" ] # AWS DNS resolver, Google DNS
        add_tag => [ "_dns_reverse_lookup" ]
        hit_cache_size => 10000
        failed_cache_size => 1000
        failed_cache_ttl => 60
        max_retries => 5
      }
    } else {
      dns {
        action => "replace"
        resolve => [ "[source][address]" ]
        nameserver => [ "10.1.0.2", "8.8.8.8" ] # AWS DNS resolver, Google DNS
        add_tag => [ "_dns_resolve_lookup" ]
        hit_cache_size => 10000
        failed_cache_size => 1000
        failed_cache_ttl => 60
        max_retries => 5
      }
    }
  }

  # Extract registered domain from source.domain (e.g. softbank126128224002.bbtec.net -> bbtec.net)
  if [source][domain] and [source][domain] !~ /^\d{1,3}(\.\d{1,3}){3}$/ {
    tld {
      source => "[source][domain]"
      target => "[source][tld]"
    }
    mutate {
      rename => {
        "[source][tld][domain]" => "[source][registered_domain]"
        "[source][tld][tld]"    => "[source][top_level_domain]"
        "[source][tld][trd]"    => "[source][subdomain]"
      }
      remove_field => [ "[source][tld]" ]
    }
  }

  # Use the raw event message as a UUID to avoid duplication in elasticsearch
  fingerprint {
    ecs_compatibility => "v8"
    source => "message"
    target => "[event][hash]"
    method => "MURMUR3"
  }

  # Convert sequence field to integer
  mutate {
    convert => { "[event][sequence]" => "integer" }
    id => "convert_sequence_to_integer"
  }

  # Ensure consistent HTTP response body bytes handling
  if [http][response][body][bytes] {
    mutate {
      convert => { "[http][response][body][bytes]" => "integer" }
      id => "convert_response_bytes_to_integer"
    }
  }

  # Normalize timestamps (IIS/FTP only — Apache already set @timestamp above)
  if [event][start] {
    date {
      match => ["[event][start]", "yyyy-MM-dd HH:mm:ss"]
      target => "@timestamp"
      timezone => "UTC"
      tag_on_failure => ["_event_start_normalize_skip"]
    }
  }

  # Map IIS status codes to ECS outcome (only if not already set)
  if [http][response][status_code] and ![event][outcome] {
    if [http][response][status_code] < 400 {
      mutate {
        add_field => { "[event][outcome]" => "success" }
      }
    } else {
      mutate {
        add_field => { "[event][outcome]" => "failure" }
      }
    }
  }

  # Map FTP commands to event actions (only if not already set)
  if [event][action] and ![event][outcome] and [http][response][status_code] {
    if [http][response][status_code] < 400 {
      mutate {
        add_field => { "[event][outcome]" => "success" }
      }
    } else {
      mutate {
        add_field => { "[event][outcome]" => "failure" }
      }
    }
  }
}
