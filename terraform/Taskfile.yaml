# Taskfile for o11y-cloudfront-batch Terraform
# =====================================
#
# Modules and their deployment order:
#   0. o11y-platform          - OpenSearch domain, bootstrapped with o11y_cloudfront_batch_enabled=false
#                              (deploy first, separate repo)
#   1. iam/policies/         - IAM policy + role attachment (admin required); publishes
#                              ec2_role_arn to SSM
#   1.5. o11y-platform        - re-apply with o11y_cloudfront_batch_enabled=true (access-policy update
#                              only, separate repo) — Logstash gets 403s from OpenSearch until
#                              this runs
#   2. s3/                   - S3 log bucket (Project-Power-User)
#   3. logstash/             - Logstash EC2 instance (admin required — iam:PassRole)
#
# Prerequisites:
#   brew install go-task/tap/go-task
#   export AWS_ACCESS_KEY_ID=...
#   export AWS_SECRET_ACCESS_KEY=...
#   export AWS_DEFAULT_REGION=...
#
# Terraform state backend:
#   Backend bucket names are not stored in this repo. Supply TFSTATE_BUCKET before running
#   any *:init task, or use cds-infra-deploy Terragrunt (which reads it from venue.hcl):
#     export TFSTATE_BUCKET=<tfstate-bucket-name>   # e.g. pds-dev-infra or pds-prod-infra
#     task s3:init VENUE=dev
#
# tfvars:
#   By default, tfvars are read from a local cds-infra-deploy checkout:
#     export CDS_INFRA_DEPLOY_DIR=/path/to/cds-infra-deploy
#     task s3:plan VENUE=dev
#   To use this repo's own (gitignored) tfvars/ dirs instead -- e.g. for personal
#   iteration before promoting values to cds-infra-deploy -- pass LOCAL=1:
#     task s3:plan VENUE=dev LOCAL=1

---

version: '3'

dotenv:
    - .env

tasks:

    # ------------------------------------------------------------------
    # AWS helper
    # ------------------------------------------------------------------

    aws:
        desc: "Verify AWS credentials are configured"
        silent: true
        cmds:
            - aws sts get-caller-identity --output json

    auth:
        desc: "Export SSO credentials as env vars for Terraform (re-run when session expires)"
        silent: true
        cmds:
            - |
              echo "Run the following in your shell to authenticate Terraform:"
              echo ""
              echo '  eval $(aws configure export-credentials --profile {{.AWS_PROFILE}} --format env)'
              echo ""
              echo "Credentials are valid for ~1 hour."

    # ------------------------------------------------------------------
    # S3: Log storage bucket
    # Can be run by Project-Power-User.
    # ------------------------------------------------------------------

    s3:init:
        desc: "Initialize S3 module Terraform (set TFSTATE_BUCKET env var or use cds-infra-deploy Terragrunt)"
        deps: [aws]
        dir: s3
        requires:
            vars:
                - name: VENUE
                  enum: [dev, test, prod]
        cmds:
            - |
              BACKEND_ARGS=""
              [ -n "$TFSTATE_BUCKET" ] && BACKEND_ARGS="-backend-config=bucket=$TFSTATE_BUCKET -backend-config=region=us-west-2 -backend-config=encrypt=true"
              terraform init -no-color -reconfigure $BACKEND_ARGS {{.CLI_ARGS}}

    s3:validate:
        desc: "Validate S3 module Terraform files"
        dir: s3
        cmds:
            - terraform validate -no-color

    s3:plan:
        desc: "Plan S3 bucket changes"
        deps: ["s3:init"]
        dir: s3
        requires:
            vars:
                - name: VENUE
                  enum: [dev, test, prod]
        vars:
            TFVARS_COMMON:
                sh: |
                    if [ "{{.LOCAL}}" = "1" ]; then
                        echo "../tfvars/common-{{.VENUE}}.tfvars"
                    elif [ -n "$CDS_INFRA_DEPLOY_DIR" ]; then
                        echo "$CDS_INFRA_DEPLOY_DIR/venues/{{.VENUE}}/o11y-cloudfront-batch/common.tfvars"
                    else
                        echo "Set CDS_INFRA_DEPLOY_DIR (path to a cds-infra-deploy checkout) or pass LOCAL=1 to use this repo's local tfvars/ dir." >&2
                        exit 1
                    fi
            TFVARS_MODULE:
                sh: |
                    if [ "{{.LOCAL}}" = "1" ]; then
                        echo "tfvars/{{.VENUE}}.tfvars"
                    elif [ -n "$CDS_INFRA_DEPLOY_DIR" ]; then
                        echo "$CDS_INFRA_DEPLOY_DIR/venues/{{.VENUE}}/o11y-cloudfront-batch/s3.tfvars"
                    else
                        echo "Set CDS_INFRA_DEPLOY_DIR (path to a cds-infra-deploy checkout) or pass LOCAL=1 to use this repo's local tfvars/ dir." >&2
                        exit 1
                    fi
        cmds:
            - terraform plan -var-file={{.TFVARS_COMMON}} -var-file={{.TFVARS_MODULE}} {{.CLI_ARGS}}

    s3:deploy:
        desc: "Deploy S3 bucket and lifecycle policy"
        aliases: ["s3:apply"]
        deps: ["s3:init"]
        dir: s3
        requires:
            vars:
                - name: VENUE
                  enum: [dev, test, prod]
        vars:
            TFVARS_COMMON:
                sh: |
                    if [ "{{.LOCAL}}" = "1" ]; then
                        echo "../tfvars/common-{{.VENUE}}.tfvars"
                    elif [ -n "$CDS_INFRA_DEPLOY_DIR" ]; then
                        echo "$CDS_INFRA_DEPLOY_DIR/venues/{{.VENUE}}/o11y-cloudfront-batch/common.tfvars"
                    else
                        echo "Set CDS_INFRA_DEPLOY_DIR (path to a cds-infra-deploy checkout) or pass LOCAL=1 to use this repo's local tfvars/ dir." >&2
                        exit 1
                    fi
            TFVARS_MODULE:
                sh: |
                    if [ "{{.LOCAL}}" = "1" ]; then
                        echo "tfvars/{{.VENUE}}.tfvars"
                    elif [ -n "$CDS_INFRA_DEPLOY_DIR" ]; then
                        echo "$CDS_INFRA_DEPLOY_DIR/venues/{{.VENUE}}/o11y-cloudfront-batch/s3.tfvars"
                    else
                        echo "Set CDS_INFRA_DEPLOY_DIR (path to a cds-infra-deploy checkout) or pass LOCAL=1 to use this repo's local tfvars/ dir." >&2
                        exit 1
                    fi
        cmds:
            - terraform apply -var-file={{.TFVARS_COMMON}} -var-file={{.TFVARS_MODULE}} {{.CLI_ARGS}}

    s3:destroy:
        desc: "Destroy S3 bucket resources"
        deps: ["s3:init"]
        dir: s3
        requires:
            vars:
                - name: VENUE
                  enum: [dev, test, prod]
        vars:
            TFVARS_COMMON:
                sh: |
                    if [ "{{.LOCAL}}" = "1" ]; then
                        echo "../tfvars/common-{{.VENUE}}.tfvars"
                    elif [ -n "$CDS_INFRA_DEPLOY_DIR" ]; then
                        echo "$CDS_INFRA_DEPLOY_DIR/venues/{{.VENUE}}/o11y-cloudfront-batch/common.tfvars"
                    else
                        echo "Set CDS_INFRA_DEPLOY_DIR (path to a cds-infra-deploy checkout) or pass LOCAL=1 to use this repo's local tfvars/ dir." >&2
                        exit 1
                    fi
            TFVARS_MODULE:
                sh: |
                    if [ "{{.LOCAL}}" = "1" ]; then
                        echo "tfvars/{{.VENUE}}.tfvars"
                    elif [ -n "$CDS_INFRA_DEPLOY_DIR" ]; then
                        echo "$CDS_INFRA_DEPLOY_DIR/venues/{{.VENUE}}/o11y-cloudfront-batch/s3.tfvars"
                    else
                        echo "Set CDS_INFRA_DEPLOY_DIR (path to a cds-infra-deploy checkout) or pass LOCAL=1 to use this repo's local tfvars/ dir." >&2
                        exit 1
                    fi
        cmds:
            - terraform apply -destroy -var-file={{.TFVARS_COMMON}} -var-file={{.TFVARS_MODULE}} {{.CLI_ARGS}}

    s3:refresh:
        desc: "Refresh S3 module Terraform state"
        deps: ["s3:init"]
        dir: s3
        requires:
            vars:
                - name: VENUE
                  enum: [dev, test, prod]
        vars:
            TFVARS_COMMON:
                sh: |
                    if [ "{{.LOCAL}}" = "1" ]; then
                        echo "../tfvars/common-{{.VENUE}}.tfvars"
                    elif [ -n "$CDS_INFRA_DEPLOY_DIR" ]; then
                        echo "$CDS_INFRA_DEPLOY_DIR/venues/{{.VENUE}}/o11y-cloudfront-batch/common.tfvars"
                    else
                        echo "Set CDS_INFRA_DEPLOY_DIR (path to a cds-infra-deploy checkout) or pass LOCAL=1 to use this repo's local tfvars/ dir." >&2
                        exit 1
                    fi
            TFVARS_MODULE:
                sh: |
                    if [ "{{.LOCAL}}" = "1" ]; then
                        echo "tfvars/{{.VENUE}}.tfvars"
                    elif [ -n "$CDS_INFRA_DEPLOY_DIR" ]; then
                        echo "$CDS_INFRA_DEPLOY_DIR/venues/{{.VENUE}}/o11y-cloudfront-batch/s3.tfvars"
                    else
                        echo "Set CDS_INFRA_DEPLOY_DIR (path to a cds-infra-deploy checkout) or pass LOCAL=1 to use this repo's local tfvars/ dir." >&2
                        exit 1
                    fi
        cmds:
            - terraform plan -refresh-only -var-file={{.TFVARS_COMMON}} -var-file={{.TFVARS_MODULE}} {{.CLI_ARGS}}

    s3:sync:
        desc: "Apply refresh-only to sync S3 state without changing infrastructure"
        deps: ["s3:init"]
        dir: s3
        requires:
            vars:
                - name: VENUE
                  enum: [dev, test, prod]
        vars:
            TFVARS_COMMON:
                sh: |
                    if [ "{{.LOCAL}}" = "1" ]; then
