                        echo "$CDS_INFRA_DEPLOY_DIR/venues/{{.VENUE}}/o11y-cloudfront-batch/common.tfvars"
                    else
                        echo "Set CDS_INFRA_DEPLOY_DIR (path to a cds-infra-deploy checkout) or pass LOCAL=1 to use this repo's local tfvars/ dir." >&2
                        exit 1
                    fi
            TFVARS_MODULE:
                sh: |
                    if [ "{{.LOCAL}}" = "1" ]; then
                        echo "tfvars/{{.VENUE}}.tfvars"
                    elif [ -n "$CDS_INFRA_DEPLOY_DIR" ]; then
                        echo "$CDS_INFRA_DEPLOY_DIR/venues/{{.VENUE}}/o11y-cloudfront-batch/iam-policies.tfvars"
                    else
                        echo "Set CDS_INFRA_DEPLOY_DIR (path to a cds-infra-deploy checkout) or pass LOCAL=1 to use this repo's local tfvars/ dir." >&2
                        exit 1
                    fi
        cmds:
            - terraform plan -refresh-only -var-file={{.TFVARS_COMMON}} -var-file={{.TFVARS_MODULE}} {{.CLI_ARGS}}

    iam:sync:
        desc: "Apply refresh-only to sync IAM state without changing infrastructure"
        deps: ["iam:init"]
        dir: iam/policies
        requires:
            vars:
                - name: VENUE
                  enum: [dev, test, prod]
        vars:
            TFVARS_COMMON:
                sh: |
                    if [ "{{.LOCAL}}" = "1" ]; then
                        echo "../../tfvars/common-{{.VENUE}}.tfvars"
                    elif [ -n "$CDS_INFRA_DEPLOY_DIR" ]; then
                        echo "$CDS_INFRA_DEPLOY_DIR/venues/{{.VENUE}}/o11y-cloudfront-batch/common.tfvars"
                    else
                        echo "Set CDS_INFRA_DEPLOY_DIR (path to a cds-infra-deploy checkout) or pass LOCAL=1 to use this repo's local tfvars/ dir." >&2
                        exit 1
                    fi
            TFVARS_MODULE:
                sh: |
                    if [ "{{.LOCAL}}" = "1" ]; then
                        echo "tfvars/{{.VENUE}}.tfvars"
                    elif [ -n "$CDS_INFRA_DEPLOY_DIR" ]; then
                        echo "$CDS_INFRA_DEPLOY_DIR/venues/{{.VENUE}}/o11y-cloudfront-batch/iam-policies.tfvars"
                    else
                        echo "Set CDS_INFRA_DEPLOY_DIR (path to a cds-infra-deploy checkout) or pass LOCAL=1 to use this repo's local tfvars/ dir." >&2
                        exit 1
                    fi
        cmds:
            - terraform apply -refresh-only -var-file={{.TFVARS_COMMON}} -var-file={{.TFVARS_MODULE}} {{.CLI_ARGS}}

    # ------------------------------------------------------------------
    # Default
    # ------------------------------------------------------------------

    default:
        cmds:
            - task --list
        silent: true

