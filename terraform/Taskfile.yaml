                sh: |
                    if [ "{{.LOCAL}}" = "1" ]; then
                        echo "tfvars/{{.VENUE}}.tfvars"
                    elif [ -n "$CDS_INFRA_DEPLOY_DIR" ]; then
                        echo "$CDS_INFRA_DEPLOY_DIR/venues/{{.VENUE}}/o11y-cloudfront-batch/iam-policies.tfvars"
