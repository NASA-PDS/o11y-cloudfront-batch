                        exit 1
                    fi
            TFVARS_MODULE:
                sh: |
                    if [ "{{.LOCAL}}" = "1" ]; then
                        echo "tfvars/{{.VENUE}}.tfvars"
                    elif [ -n "$CDS_INFRA_DEPLOY_DIR" ]; then
                        echo "$CDS_INFRA_DEPLOY_DIR/venues/{{.VENUE}}/o11y-cloudfront-batch/s3.tfvars"
                    else
                        echo "Set CDS_INFRA_DEPLOY_DIR (path to a cds-infra-deploy checkout) or pass LOCAL=1 to use this repo's local tfvars/ dir." >&2
                        exit 1
                    fi
        cmds:
            - terraform apply -refresh-only -var-file={{.TFVARS_COMMON}} -var-file={{.TFVARS_MODULE}} {{.CLI_ARGS}}

    # ------------------------------------------------------------------
    # Logstash: EC2 instance
    # Requires iam:PassRole — must be run by a system administrator.
    # Run after opensearch:deploy (reads endpoint from SSM) and iam:deploy.
    # ------------------------------------------------------------------

    logstash:init:
        desc: "Initialize Logstash EC2 module Terraform (requires admin — iam:PassRole; set TFSTATE_BUCKET env var or use cds-infra-deploy Terragrunt)"
