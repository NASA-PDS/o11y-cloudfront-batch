# Taskfile for o11y-cloudfront-batch Terraform
# =====================================
#
# Local iteration wrapper. Operational deploys (dev, test, prod) use Terragrunt from
# cds-infra-deploy, as described in the o11y-platform deployment runbook:
#   https://github.com/NASA-PDS/o11y-platform/blob/main/terraform/README.md
# The runbook owns the deployment order and the permission tier of each module.
#
# Modules: iam/, s3/, logstash/
#
# Prerequisites:
#   brew install go-task/tap/go-task
#   export AWS_ACCESS_KEY_ID=...
#   export AWS_SECRET_ACCESS_KEY=...
#   export AWS_DEFAULT_REGION=...
#
# Terraform state backend:
#   Backend bucket names are not stored in this repo. Supply TFSTATE_BUCKET before running
#   any *:init task, or use cds-infra-deploy Terragrunt (which reads it from venue.hcl):
#     export TFSTATE_BUCKET=<tfstate-bucket-name>   # e.g. pds-dev-infra or pds-prod-infra
#     task s3:init VENUE=dev
#
# tfvars:
#   Every task reads this repo's own gitignored tfvars, copied from the examples:
#     cp -p tfvars/common.tfvars.example tfvars/common-dev.tfvars
#     cp -p s3/tfvars/dev.tfvars.example s3/tfvars/dev.tfvars
#     task s3:plan VENUE=dev

---

version: '3'

dotenv:
    - .env

tasks:

    # ------------------------------------------------------------------
    # AWS helper
    # ------------------------------------------------------------------

    aws:
        desc: "Verify AWS credentials are configured"
        silent: true
        cmds:
            - aws sts get-caller-identity --output json

    auth:
        desc: "Export SSO credentials as env vars for Terraform (re-run when session expires)"
        silent: true
        cmds:
            - |
              echo "Run the following in your shell to authenticate Terraform:"
              echo ""
              echo '  eval $(aws configure export-credentials --profile {{.AWS_PROFILE}} --format env)'
              echo ""
              echo "Credentials are valid for ~1 hour."

    # ------------------------------------------------------------------
    # S3: Log storage bucket
    # Can be run by Project-Power-User.
    # ------------------------------------------------------------------

    s3:init:
        desc: "Initialize S3 module Terraform (set TFSTATE_BUCKET env var or use cds-infra-deploy Terragrunt)"
        deps: [aws]
        dir: s3
        requires:
            vars:
                - name: VENUE
                  enum: [dev, test, prod]
        cmds:
            - |
              BACKEND_ARGS=""
              [ -n "$TFSTATE_BUCKET" ] && BACKEND_ARGS="-backend-config=bucket=$TFSTATE_BUCKET -backend-config=region=us-west-2 -backend-config=encrypt=true -backend-config=use_lockfile=true"
              terraform init -no-color -reconfigure $BACKEND_ARGS {{.CLI_ARGS}}

    s3:validate:
        desc: "Validate S3 module Terraform files"
        dir: s3
        cmds:
            - terraform validate -no-color

    s3:plan:
        desc: "Plan S3 bucket changes"
        deps: ["s3:init"]
        dir: s3
        requires:
            vars:
                - name: VENUE
                  enum: [dev, test, prod]
        vars:
            TFVARS_COMMON: "../tfvars/common-{{.VENUE}}.tfvars"
            TFVARS_MODULE: "tfvars/{{.VENUE}}.tfvars"
        cmds:
            - terraform plan -var-file={{.TFVARS_COMMON}} -var-file={{.TFVARS_MODULE}} {{.CLI_ARGS}}

    s3:deploy:
        desc: "Deploy S3 bucket and lifecycle policy"
        aliases: ["s3:apply"]
        deps: ["s3:init"]
        dir: s3
        requires:
            vars:
                - name: VENUE
                  enum: [dev, test, prod]
        vars:
            TFVARS_COMMON: "../tfvars/common-{{.VENUE}}.tfvars"
            TFVARS_MODULE: "tfvars/{{.VENUE}}.tfvars"
        cmds:
            - terraform apply -var-file={{.TFVARS_COMMON}} -var-file={{.TFVARS_MODULE}} {{.CLI_ARGS}}

    s3:destroy:
        desc: "Destroy S3 bucket resources"
        deps: ["s3:init"]
        dir: s3
        requires:
            vars:
                - name: VENUE
                  enum: [dev, test, prod]
        vars:
            TFVARS_COMMON: "../tfvars/common-{{.VENUE}}.tfvars"
            TFVARS_MODULE: "tfvars/{{.VENUE}}.tfvars"
        cmds:
            - terraform apply -destroy -var-file={{.TFVARS_COMMON}} -var-file={{.TFVARS_MODULE}} {{.CLI_ARGS}}

    s3:refresh:
        desc: "Refresh S3 module Terraform state"
        deps: ["s3:init"]
        dir: s3
        requires:
            vars:
                - name: VENUE
                  enum: [dev, test, prod]
        vars:
            TFVARS_COMMON: "../tfvars/common-{{.VENUE}}.tfvars"
            TFVARS_MODULE: "tfvars/{{.VENUE}}.tfvars"
        cmds:
            - terraform plan -refresh-only -var-file={{.TFVARS_COMMON}} -var-file={{.TFVARS_MODULE}} {{.CLI_ARGS}}

    s3:sync:
        desc: "Apply refresh-only to sync S3 state without changing infrastructure"
        deps: ["s3:init"]
        dir: s3
        requires:
            vars:
                - name: VENUE
                  enum: [dev, test, prod]
        vars:
            TFVARS_COMMON: "../tfvars/common-{{.VENUE}}.tfvars"
            TFVARS_MODULE: "tfvars/{{.VENUE}}.tfvars"
        cmds:
            - terraform apply -refresh-only -var-file={{.TFVARS_COMMON}} -var-file={{.TFVARS_MODULE}} {{.CLI_ARGS}}

    # ------------------------------------------------------------------
    # Logstash: EC2 instance
    # Requires iam:PassRole (Platform Engineer tier).
    # Run after opensearch:deploy (reads endpoint from SSM) and iam:deploy.
    # ------------------------------------------------------------------

    logstash:init:
        desc: "Initialize Logstash EC2 module Terraform (requires iam:PassRole; set TFSTATE_BUCKET env var or use cds-infra-deploy Terragrunt)"
        deps: [aws]
        dir: logstash
        requires:
            vars:
                - name: VENUE
                  enum: [dev, test, prod]
        cmds:
            - |
              BACKEND_ARGS=""
              [ -n "$TFSTATE_BUCKET" ] && BACKEND_ARGS="-backend-config=bucket=$TFSTATE_BUCKET -backend-config=region=us-west-2 -backend-config=encrypt=true -backend-config=use_lockfile=true"
              terraform init -no-color -reconfigure $BACKEND_ARGS {{.CLI_ARGS}}

    logstash:validate:
        desc: "Validate Logstash EC2 module Terraform files"
        dir: logstash
        cmds:
            - terraform validate -no-color

    logstash:plan:
        desc: "Plan Logstash EC2 instance changes (requires iam:PassRole)"
        deps: ["logstash:init"]
        dir: logstash
        requires:
            vars:
                - name: VENUE
                  enum: [dev, test, prod]
        vars:
            TFVARS_COMMON: "../tfvars/common-{{.VENUE}}.tfvars"
            TFVARS_MODULE: "tfvars/{{.VENUE}}.tfvars"
        cmds:
            - terraform plan -var-file={{.TFVARS_COMMON}} -var-file={{.TFVARS_MODULE}} {{.CLI_ARGS}}

    logstash:deploy:
        desc: "Deploy Logstash EC2 instance (requires iam:PassRole)"
        aliases: ["logstash:apply"]
        deps: ["logstash:init"]
        dir: logstash
        requires:
            vars:
                - name: VENUE
                  enum: [dev, test, prod]
        vars:
            TFVARS_COMMON: "../tfvars/common-{{.VENUE}}.tfvars"
            TFVARS_MODULE: "tfvars/{{.VENUE}}.tfvars"
        cmds:
            - terraform apply -var-file={{.TFVARS_COMMON}} -var-file={{.TFVARS_MODULE}} {{.CLI_ARGS}}

    logstash:destroy:
        desc: "Destroy Logstash EC2 instance"
        deps: ["logstash:init"]
        dir: logstash
        requires:
            vars:
                - name: VENUE
                  enum: [dev, test, prod]
        vars:
            TFVARS_COMMON: "../tfvars/common-{{.VENUE}}.tfvars"
            TFVARS_MODULE: "tfvars/{{.VENUE}}.tfvars"
        cmds:
            - terraform apply -destroy -var-file={{.TFVARS_COMMON}} -var-file={{.TFVARS_MODULE}} {{.CLI_ARGS}}

    logstash:refresh:
        desc: "Refresh Logstash module Terraform state"
        deps: ["logstash:init"]
        dir: logstash
        requires:
            vars:
                - name: VENUE
                  enum: [dev, test, prod]
        vars:
            TFVARS_COMMON: "../tfvars/common-{{.VENUE}}.tfvars"
            TFVARS_MODULE: "tfvars/{{.VENUE}}.tfvars"
        cmds:
            - terraform plan -refresh-only -var-file={{.TFVARS_COMMON}} -var-file={{.TFVARS_MODULE}} {{.CLI_ARGS}}

    logstash:sync:
        desc: "Apply refresh-only to sync Logstash state without changing infrastructure"
        deps: ["logstash:init"]
        dir: logstash
        requires:
            vars:
                - name: VENUE
                  enum: [dev, test, prod]
        vars:
            TFVARS_COMMON: "../tfvars/common-{{.VENUE}}.tfvars"
            TFVARS_MODULE: "tfvars/{{.VENUE}}.tfvars"
        cmds:
            - terraform apply -refresh-only -var-file={{.TFVARS_COMMON}} -var-file={{.TFVARS_MODULE}} {{.CLI_ARGS}}

    # ------------------------------------------------------------------
    # IAM: EC2 role + profile, policy + role attachment (requires admin/elevated role)
    # Run by a system administrator — Project-Power-User lacks iam:CreatePolicy.
    # Must be applied before logstash:deploy (EC2 needs the policy attached at launch).
    # ------------------------------------------------------------------

    iam:init:
        desc: "Initialize IAM policies module Terraform (set TFSTATE_BUCKET env var or use cds-infra-deploy Terragrunt)"
        deps: [aws]
        dir: iam
        requires:
            vars:
                - name: VENUE
                  enum: [dev, test, prod]
        cmds:
            - |
              BACKEND_ARGS=""
              [ -n "$TFSTATE_BUCKET" ] && BACKEND_ARGS="-backend-config=bucket=$TFSTATE_BUCKET -backend-config=region=us-west-2 -backend-config=encrypt=true -backend-config=use_lockfile=true"
              terraform init -no-color -reconfigure $BACKEND_ARGS {{.CLI_ARGS}}

    iam:validate:
        desc: "Validate IAM policies module Terraform files"
        dir: iam
        cmds:
            - terraform validate -no-color

    iam:plan:
        desc: "Plan IAM policy changes (requires iam:CreatePolicy permissions)"
        deps: ["iam:init"]
        dir: iam
        requires:
            vars:
                - name: VENUE
                  enum: [dev, test, prod]
        vars:
            TFVARS_COMMON: "../tfvars/common-{{.VENUE}}.tfvars"
            TFVARS_MODULE: "tfvars/{{.VENUE}}.tfvars"
        cmds:
            - terraform plan -var-file={{.TFVARS_COMMON}} -var-file={{.TFVARS_MODULE}} {{.CLI_ARGS}}

    iam:deploy:
        desc: "Deploy IAM policies and role attachments (requires admin role)"
        aliases: ["iam:apply"]
        deps: ["iam:init"]
        dir: iam
        requires:
            vars:
                - name: VENUE
                  enum: [dev, test, prod]
        vars:
            TFVARS_COMMON: "../tfvars/common-{{.VENUE}}.tfvars"
            TFVARS_MODULE: "tfvars/{{.VENUE}}.tfvars"
        cmds:
            - terraform apply -var-file={{.TFVARS_COMMON}} -var-file={{.TFVARS_MODULE}} {{.CLI_ARGS}}

    iam:destroy:
        desc: "Destroy IAM policies and role attachments"
        deps: ["iam:init"]
        dir: iam
        requires:
            vars:
                - name: VENUE
                  enum: [dev, test, prod]
        vars:
            TFVARS_COMMON: "../tfvars/common-{{.VENUE}}.tfvars"
            TFVARS_MODULE: "tfvars/{{.VENUE}}.tfvars"
        cmds:
            - terraform apply -destroy -var-file={{.TFVARS_COMMON}} -var-file={{.TFVARS_MODULE}} {{.CLI_ARGS}}

    iam:refresh:
        desc: "Refresh IAM policies module Terraform state"
        deps: ["iam:init"]
        dir: iam
        requires:
            vars:
                - name: VENUE
                  enum: [dev, test, prod]
        vars:
            TFVARS_COMMON: "../tfvars/common-{{.VENUE}}.tfvars"
            TFVARS_MODULE: "tfvars/{{.VENUE}}.tfvars"
        cmds:
            - terraform plan -refresh-only -var-file={{.TFVARS_COMMON}} -var-file={{.TFVARS_MODULE}} {{.CLI_ARGS}}

    iam:sync:
        desc: "Apply refresh-only to sync IAM state without changing infrastructure"
        deps: ["iam:init"]
        dir: iam
        requires:
            vars:
                - name: VENUE
                  enum: [dev, test, prod]
        vars:
            TFVARS_COMMON: "../tfvars/common-{{.VENUE}}.tfvars"
            TFVARS_MODULE: "tfvars/{{.VENUE}}.tfvars"
        cmds:
            - terraform apply -refresh-only -var-file={{.TFVARS_COMMON}} -var-file={{.TFVARS_MODULE}} {{.CLI_ARGS}}

    # ------------------------------------------------------------------
    # Default
    # ------------------------------------------------------------------

    default:
        cmds:
            - task --list
        silent: true

...

